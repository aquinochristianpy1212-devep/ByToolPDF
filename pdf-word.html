<section class="hero"><h1>PDF a Word</h1><p>Convertí tu PDF a DOCX usando el backend con Python y pdf2docx.</p></section>
<main class="container"><div class="card">
<label class="upload" for="fileInput"><div class="upload-icon">🡹</div><h2>Seleccionar PDF</h2><span>Subí tu PDF para convertirlo a Word</span><input type="file" id="fileInput" accept="application/pdf"><div class="file-name" id="fileName"></div></label>
<button class="btn" id="runBtn" disabled data-text="Convertir PDF a Word" onclick="sendToBackend('/api/pdf-to-word','pdf-convertido.docx')">Convertir PDF a Word</button>
<div class="downloads" id="downloads"></div><div class="message" id="message"></div>
<p class="note"> <b></b></p>
</div></main>

<script src="app.js"></script>
<script>
const fileInput=qs("fileInput"),fileName=qs("fileName"),runBtn=qs("runBtn");
let file=null;
fileInput.onchange=()=>{clearResults();file=fileInput.files[0];if(!file){return}fileName.textContent=file.name;runBtn.disabled=false};
async function sendToBackend(endpoint,outputName){
  clearResults();
  if(!file){showMessage("Seleccioná un archivo primero.","error");return}
  try{
    setLoading(runBtn,true,"Procesando...");
    const fd=new FormData();
    fd.append("file",file);
    const res=await fetch(API+endpoint,{method:"POST",body:fd});
    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      throw new Error(err.error||"Error del servidor");
    }
    const blob=await res.blob();
    addDownload(URL.createObjectURL(blob),outputName,"Descargar resultado");
    showMessage("Archivo convertido correctamente.","ok");
  }catch(e){
    showMessage(e.message||"No se pudo procesar. Revisá que el backend esté activo.","error");
  }finally{
    setLoading(runBtn,false,runBtn.dataset.text);
  }
}
</script>
</body></html>
