<section class="hero"><h1>Separar PDF</h1><p>Subí tu PDF, visualizalo y elegí desde qué página hasta qué página querés separar.</p></section>
<main class="container"><div class="card">
<label class="upload" for="pdfInput"><div class="upload-icon">🡹</div><h2>Seleccionar PDF</h2><span>Arrastrá o hacé clic para subir tu PDF</span><input type="file" id="pdfInput" accept="application/pdf"><div class="file-name" id="fileName"></div></label>
<div class="info" id="pdfInfo">Todavía no cargaste ningún PDF.</div>
<div class="viewer" id="viewer"><div class="viewer-head"><span>Vista previa</span><strong id="currentPage">Página 1 de 1</strong></div><div class="viewer-pages" id="viewerPages"></div></div>
<div class="form"><div><label>Desde página</label><input type="number" id="fromPage" min="1"></div><div><label>Hasta página</label><input type="number" id="toPage" min="1"></div><div class="full"><label>Nombre final</label><input id="outputName" placeholder="pdf-separado"></div></div>
<button class="btn" id="splitBtn" disabled>Separar PDF</button>
<div class="downloads" id="downloads"></div><div class="message" id="message"></div>
</div></main>
<script src="app.js"></script><script src="viewer.js"></script>
<script>
const pdfInput=qs("pdfInput"),fileName=qs("fileName"),pdfInfo=qs("pdfInfo"),fromPage=qs("fromPage"),toPage=qs("toPage"),outputName=qs("outputName"),splitBtn=qs("splitBtn");
let selectedPdfBytes=null,totalPages=0;
pdfInput.onchange=async()=>{clearResults();clearViewer();const file=pdfInput.files[0];if(!file||file.type!=="application/pdf"){showMessage("Seleccioná un PDF válido.","error");return}
try{selectedPdfBytes=await file.arrayBuffer();const doc=await PDFLib.PDFDocument.load(selectedPdfBytes);totalPages=doc.getPageCount();fileName.textContent=file.name;pdfInfo.textContent=`PDF cargado. Total de páginas: ${totalPages}`;fromPage.value=1;toPage.value=totalPages;fromPage.max=totalPages;toPage.max=totalPages;outputName.value=file.name.replace(/\.pdf$/i,"")+"-separado";splitBtn.disabled=false;showMessage("Cargando vista previa...","ok");await renderPdfViewer(selectedPdfBytes,(n)=>totalPages=n);showMessage("PDF listo.","ok")}catch(e){console.error(e);showMessage("No se pudo leer el PDF.","error")}};
function validRange(a,b){return selectedPdfBytes&&Number.isInteger(a)&&Number.isInteger(b)&&a>=1&&b>=1&&a<=b&&b<=totalPages}
splitBtn.onclick=async()=>{clearResults();const start=Number(fromPage.value),end=Number(toPage.value);if(!validRange(start,end)){showMessage(`Rango inválido. Este PDF tiene ${totalPages} páginas.`,"error");return}
try{setLoading(splitBtn,true,"Separando...");const src=await PDFLib.PDFDocument.load(selectedPdfBytes);const out=await PDFLib.PDFDocument.create();const idx=[];for(let i=start-1;i<=end-1;i++)idx.push(i);const pages=await out.copyPages(src,idx);pages.forEach(p=>out.addPage(p));const bytes=await out.save();addDownload(createPdfUrl(bytes),cleanFileName(outputName.value||"pdf-separado")+".pdf",`Descargar páginas ${start} a ${end}`);showMessage("PDF separado correctamente.","ok")}catch(e){showMessage("Error al separar PDF.","error")}finally{setLoading(splitBtn,false,"Separar PDF")}};
</script>
</body></html>
